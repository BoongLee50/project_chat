spring:
  application:
    name: moonlighttalk-server
  profiles:
    active: local
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: INFO

app:
  jwt:
    secret: ${APP_JWT_SECRET:local-dev-secret-change-me-please-0123456789}
    access-token-ttl-minutes: 60
    refresh-token-ttl-days: 30
  gate:
    open-hour: 17
    close-hour: 6
  scheduler:
    # ⚠️ gate-open/close cron은 app.gate.open-hour/close-hour와 같은 값이어야 한다.
    gate-open-cron: "0 0 17 * * *"
    gate-close-cron: "0 0 6 * * *"
    daily-cleanup-cron: "0 5 6 * * *"
    presence-sweep-ms: 300000
    # 배치를 수동 실행하는 개발용 엔드포인트(운영에서는 절대 켜지 말 것).
    dev-trigger-enabled: false
  friend:
    # 기획서에 20과 30이 함께 적혀 있어(보완 문서 대기) 설정으로 뺐다.
    # 프리미엄이 더 많이 가질 수 있다는 해석으로 잡아 둔 잠정값.
    max-count: 20
    max-count-premium: 30
  redis:
    enabled: false
  storage:
    type: local
    local-path: server/uploads
    download-url-ttl-minutes: 10
    region: ap-northeast-2
  auth:
    social:
      line:
        enabled: false
        client-id: ${LINE_CLIENT_ID:}
        client-secret: ${LINE_CLIENT_SECRET:}
        verify-url: https://api.line.me/oauth2/v2.1/verify
      kakao:
        enabled: false
        client-id: ${KAKAO_CLIENT_ID:}
        client-secret: ${KAKAO_CLIENT_SECRET:}
        verify-url: https://kapi.kakao.com/v2/user/me
      google:
        enabled: false
        client-id: ${GOOGLE_CLIENT_ID:}
        client-secret: ${GOOGLE_CLIENT_SECRET:}
        verify-url: https://www.googleapis.com/oauth2/v3/tokeninfo
  translate:
    provider: none
  profile:
    forbidden-nicknames: 관리자,admin,운영자,달빛톡,moonlighttalk
