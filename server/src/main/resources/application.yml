spring:
  application:
    name: moonlighttalk-server
  profiles:
    active: local
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: INFO

app:
  jwt:
    secret: ${APP_JWT_SECRET:local-dev-secret-change-me-please-0123456789}
    access-token-ttl-minutes: 60
    refresh-token-ttl-days: 30
  session:
    # 영업일(session_date)이 넘어가는 시각(KST). Plan_3에서 18시로 확정.
    # ⚠️ 이 값을 바꿔 배포할 때는 반드시 그 시각 정각에 배포할 것 —
    #    이미 저장된 행은 옛 기준으로 찍혀 있어 중간에 바꾸면 한 테이블에 두 기준이 섞인다(docs/12 §6-1).
    # ⚠️ 아래 scheduler의 cron 시각도 이 값에 맞춰야 한다.
    rollover-hour: 18
  post:
    # 오늘의 포스트 — 무료/앨범패스별 사진 수와 하루 교체 횟수(기획서 3장).
    max-photos-free: 2
    max-photos-pass: 9
    # Plan_3에서 무료·유료 구분 없이 3회로 통일됐다. 다만 다시 갈릴 수 있어 키는 둘 다 남겨 둔다.
    replace-limit-free: 3
    replace-limit-pass: 3
  garden:
    # 피드 스코어 가중치. 운영하며 튜닝할 값이라 재배포 없이 바꿀 수 있게 뺐다.
    score-pick: 50
    score-online: 10
  store:
    # 기획서 Plan_2 화면 25~30의 가격표를 그대로 옮긴 값이다.
    # price 단위는 "루나". 현금 가격(충전팩·프라임)은 스토어 콘솔이 권위이므로 여기 두지 않는다.
    luna-products:
      # 부스트 — 1매당 1시간. 10매 묶음은 20% 할인가(화면 25)
      POST_BOOST_5:       { type: BOOST,       kind: POST_BOOST,      price: 400, quantity: 5,  reason: BUY_BOOST }
      POST_BOOST_10:      { type: BOOST,       kind: POST_BOOST,      price: 640, quantity: 10, reason: BUY_BOOST }
      SPOTLIGHT_BOOST_5:  { type: BOOST,       kind: SPOTLIGHT_BOOST, price: 500, quantity: 5,  reason: BUY_BOOST }
      SPOTLIGHT_BOOST_10: { type: BOOST,       kind: SPOTLIGHT_BOOST, price: 800, quantity: 10, reason: BUY_BOOST }
      # 패스 — 7일/30일 (화면 25·29·30)
      ALBUM_PASS_7D:      { type: ENTITLEMENT, kind: ALBUM_PASS,      price: 250, duration-days: 7,  reason: BUY_ALBUM_PASS }
      ALBUM_PASS_30D:     { type: ENTITLEMENT, kind: ALBUM_PASS,      price: 800, duration-days: 30, reason: BUY_ALBUM_PASS }
      TRANSLATE_PASS_7D:  { type: ENTITLEMENT, kind: TRANSLATE_PASS,  price: 250, duration-days: 7,  reason: BUY_TRANSLATE_PASS }
      TRANSLATE_PASS_30D: { type: ENTITLEMENT, kind: TRANSLATE_PASS,  price: 800, duration-days: 30, reason: BUY_TRANSLATE_PASS }
    # 루나 충전 패키지(인앱결제) — 화면 27. 표시 가격은 스토어 SDK의 현지 가격을 쓴다.
    luna-packs:
      LUNA_200:   { luna: 200,   bonus: 0 }
      LUNA_1000:  { luna: 900,   bonus: 100 }    # 10% 할인 · 9,000원
      LUNA_5000:  { luna: 4250,  bonus: 750 }    # 15% 할인 · 42,500원
      LUNA_10000: { luna: 8000,  bonus: 2000 }   # 20% 할인 · 80,000원
      LUNA_25000: { luna: 17500, bonus: 7500 }   # 30% 할인 · 175,000원
    # 프라임(인앱결제) — 화면 26. 1개월 12,900원 / 6개월 61,900원(20% 할인)
    prime-plans:
      PRIME_1M:
        product: PRIME_1M
        duration-days: 30
        entitlements: [ALBUM_PASS, UNLIMITED_CHAT_REQ]
        boosts: { POST_BOOST: 10, SPOTLIGHT_BOOST: 5 }
      PRIME_6M:
        product: PRIME_6M
        duration-days: 180
        entitlements: [ALBUM_PASS, UNLIMITED_CHAT_REQ]
        # ⚠️ 6개월 부스트를 일괄 지급할지 매월 지급할지 기획 확인 필요 — 일단 6배로 둔다
        boosts: { POST_BOOST: 60, SPOTLIGHT_BOOST: 30 }
  chat:
    # 대화 신청 — 하루 N회는 공짜, 그 뒤로는 1건당 루나를 뺀다(기획서 5장).
    free-requests-per-day: 10
    request-luna-cost: 5
    # 음성 메시지 최대 길이. 클라도 이 시간에서 자동 정지하므로 두 값을 함께 바꿀 것.
    voice-max-duration-ms: 30000
    # 메시지 보관 기간. 방 타입 기준으로 판정한다(친구를 끊어 ENDED가 된 방도 FRIEND 기준).
    retention-days: 30
    retention-days-friend: 365
    # 한 번에 지울 행 수. 큰 트랜잭션으로 테이블을 오래 잠그지 않도록 나눠서 지운다.
    retention-batch-size: 1000
  scheduler:
    # ⚠️ 아래 cron 시각은 app.session.rollover-hour와 맞춰야 한다(경계 직후에 돈다).
    daily-cleanup-cron: "0 5 18 * * *"
    presence-sweep-ms: 300000
    # 배치를 수동 실행하는 개발용 엔드포인트(운영에서는 절대 켜지 말 것).
    dev-trigger-enabled: false
  friend:
    # Plan_3에서 과금과 무관하게 100명으로 통일됐다(20 vs 30 모순이 이렇게 정리됨).
    # 다시 갈릴 수 있어 키는 둘 다 남겨 둔다.
    max-count: 100
    max-count-premium: 100
  redis:
    enabled: false
  storage:
    type: local
    local-path: server/uploads
    download-url-ttl-minutes: 10
    region: ap-northeast-2
  auth:
    social:
      line:
        enabled: false
        client-id: ${LINE_CLIENT_ID:}
        client-secret: ${LINE_CLIENT_SECRET:}
        verify-url: https://api.line.me/oauth2/v2.1/verify
      kakao:
        enabled: false
        client-id: ${KAKAO_CLIENT_ID:}
        client-secret: ${KAKAO_CLIENT_SECRET:}
        verify-url: https://kapi.kakao.com/v2/user/me
      google:
        enabled: false
        client-id: ${GOOGLE_CLIENT_ID:}
        client-secret: ${GOOGLE_CLIENT_SECRET:}
        verify-url: https://www.googleapis.com/oauth2/v3/tokeninfo
  translate:
    provider: none
    # 무료 번역 쿼터(V7). 패스·프라임 보유자는 무제한이라 이 값을 안 탄다.
    # 채팅은 "횟수"가 아니라 "상대 수"다 — 한 번 연 상대와는 그날 계속 무료.
    free-comments-per-day: 2
    free-chat-targets-per-day: 2
  profile:
    forbidden-nicknames: 관리자,admin,운영자,달빛톡,moonlighttalk
