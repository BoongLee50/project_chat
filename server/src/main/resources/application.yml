spring:
  application:
    name: moonlighttalk-server
  profiles:
    active: local
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: INFO

app:
  jwt:
    secret: ${APP_JWT_SECRET:local-dev-secret-change-me-please-0123456789}
    access-token-ttl-minutes: 60
    refresh-token-ttl-days: 30
  gate:
    open-hour: 18
    close-hour: 5
  redis:
    enabled: false
  storage:
    type: local
    local-path: server/uploads
    download-url-ttl-minutes: 10
    region: ap-northeast-2
  auth:
    social:
      line:
        enabled: false
        client-id: ${LINE_CLIENT_ID:}
        client-secret: ${LINE_CLIENT_SECRET:}
        verify-url: https://api.line.me/oauth2/v2.1/verify
      kakao:
        enabled: false
        client-id: ${KAKAO_CLIENT_ID:}
        client-secret: ${KAKAO_CLIENT_SECRET:}
        verify-url: https://kapi.kakao.com/v2/user/me
      google:
        enabled: false
        client-id: ${GOOGLE_CLIENT_ID:}
        client-secret: ${GOOGLE_CLIENT_SECRET:}
        verify-url: https://www.googleapis.com/oauth2/v3/tokeninfo
  translate:
    provider: none
  profile:
    forbidden-nicknames: 관리자,admin,운영자,달빛톡,moonlighttalk
