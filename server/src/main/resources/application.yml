spring:
  application:
    name: moonlighttalk-server
  profiles:
    active: local
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: INFO

app:
  jwt:
    secret: ${APP_JWT_SECRET:local-dev-secret-change-me-please-0123456789}
    access-token-ttl-minutes: 60
    refresh-token-ttl-days: 30
  gate:
    open-hour: 17
    close-hour: 6
  store:
    # ⚠️ 잠정값 — BM 기획의 최종 가격표가 오면 여기만 바꾼다(코드 변경 불필요).
    #    현금 가격은 스토어 콘솔이 권위이고, 여기 price는 "루나" 단위다.
    luna-products:
      POST_BOOST_1:      { type: BOOST,       kind: POST_BOOST,      price: 30,  quantity: 1,  reason: BUY_BOOST }
      POST_BOOST_5:      { type: BOOST,       kind: POST_BOOST,      price: 130, quantity: 5,  reason: BUY_BOOST }
      SPOTLIGHT_BOOST_1: { type: BOOST,       kind: SPOTLIGHT_BOOST, price: 50,  quantity: 1,  reason: BUY_BOOST }
      ALBUM_PASS_30D:    { type: ENTITLEMENT, kind: ALBUM_PASS,      price: 200, duration-days: 30, reason: BUY_ALBUM_PASS }
      TRANSLATE_PASS_30D: { type: ENTITLEMENT, kind: TRANSLATE_PASS, price: 150, duration-days: 30, reason: BUY_TRANSLATE_PASS }
    luna-packs:
      LUNA_100:  { luna: 100,  bonus: 0 }
      LUNA_550:  { luna: 500,  bonus: 50 }
      LUNA_1200: { luna: 1000, bonus: 200 }
    prime-plans:
      PRIME_1M:
        product: PRIME_1M
        duration-days: 30
        luna: 100
        entitlements: [ALBUM_PASS, TRANSLATE_PASS, UNLIMITED_CHAT_REQ, NO_ADS]
        boosts: { POST_BOOST: 5, SPOTLIGHT_BOOST: 2 }
      PRIME_6M:
        product: PRIME_6M
        duration-days: 180
        luna: 700
        entitlements: [ALBUM_PASS, TRANSLATE_PASS, UNLIMITED_CHAT_REQ, NO_ADS]
        boosts: { POST_BOOST: 35, SPOTLIGHT_BOOST: 14 }
  chat:
    # 메시지 보관 기간. 방 타입 기준으로 판정한다(친구를 끊어 ENDED가 된 방도 FRIEND 기준).
    retention-days: 30
    retention-days-friend: 365
    # 한 번에 지울 행 수. 큰 트랜잭션으로 테이블을 오래 잠그지 않도록 나눠서 지운다.
    retention-batch-size: 1000
  scheduler:
    # ⚠️ gate-open/close cron은 app.gate.open-hour/close-hour와 같은 값이어야 한다.
    gate-open-cron: "0 0 17 * * *"
    gate-close-cron: "0 0 6 * * *"
    daily-cleanup-cron: "0 5 6 * * *"
    presence-sweep-ms: 300000
    # 배치를 수동 실행하는 개발용 엔드포인트(운영에서는 절대 켜지 말 것).
    dev-trigger-enabled: false
  friend:
    # 기획서에 20과 30이 함께 적혀 있어(보완 문서 대기) 설정으로 뺐다.
    # 프리미엄이 더 많이 가질 수 있다는 해석으로 잡아 둔 잠정값.
    max-count: 20
    max-count-premium: 30
  redis:
    enabled: false
  storage:
    type: local
    local-path: server/uploads
    download-url-ttl-minutes: 10
    region: ap-northeast-2
  auth:
    social:
      line:
        enabled: false
        client-id: ${LINE_CLIENT_ID:}
        client-secret: ${LINE_CLIENT_SECRET:}
        verify-url: https://api.line.me/oauth2/v2.1/verify
      kakao:
        enabled: false
        client-id: ${KAKAO_CLIENT_ID:}
        client-secret: ${KAKAO_CLIENT_SECRET:}
        verify-url: https://kapi.kakao.com/v2/user/me
      google:
        enabled: false
        client-id: ${GOOGLE_CLIENT_ID:}
        client-secret: ${GOOGLE_CLIENT_SECRET:}
        verify-url: https://www.googleapis.com/oauth2/v3/tokeninfo
  translate:
    provider: none
  profile:
    forbidden-nicknames: 관리자,admin,운영자,달빛톡,moonlighttalk
