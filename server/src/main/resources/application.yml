spring:
  application:
    name: moonlighttalk-server
  profiles:
    active: local
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: INFO

app:
  jwt:
    secret: ${APP_JWT_SECRET:local-dev-secret-change-me-please-0123456789}
    access-token-ttl-minutes: 60
    refresh-token-ttl-days: 30
  session:
    # 영업일(session_date)이 넘어가는 시각(KST). Plan_3에서 18시로 확정.
    # ⚠️ 이 값을 바꿔 배포할 때는 반드시 그 시각 정각에 배포할 것 —
    #    이미 저장된 행은 옛 기준으로 찍혀 있어 중간에 바꾸면 한 테이블에 두 기준이 섞인다(docs/12 §6-1).
    # ⚠️ 아래 scheduler의 cron 시각도 이 값에 맞춰야 한다.
    rollover-hour: 18
  post:
    # 오늘의 포스트 — 무료/앨범패스별 사진 수와 하루 교체 횟수(기획서 3장).
    max-photos-free: 2
    max-photos-pass: 9
    # Plan_3에서 무료·유료 구분 없이 3회로 통일됐다. 다만 다시 갈릴 수 있어 키는 둘 다 남겨 둔다.
    replace-limit-free: 3
    replace-limit-pass: 3
  garden:
    # 피드 스코어(Plan_3 4-1). 운영하며 튜닝할 값이라 재배포 없이 바꿀 수 있게 뺐다.
    # ⚠️ Plan_3에서 Pick Point(부스트 가점)가 사라졌다 — 부스트는 점수가 아니라 아래 mix로 동작한다.
    score-online: 10
    # 기준 시각은 "공유 시각과 사진 갱신 시각 중 나중"이다.
    recency:
      within1h: 30
      within3h: 20
      within5h: 10
    # 전환율 = {(좋아요×like)+(댓글×comment)+(대화신청×request)} / 총 노출 × 100
    engage:
      # 표본이 적으면 좋아요 한 번에 100%가 되어 갓 올린 포스트가 최상단에 간다.
      min-exposures: 20
      like-weight: 1
      comment-weight: 2
      request-weight: 4
      rate30: 30
      rate20: 20
      rate15: 15
      rate10: 10
      rate5: 5
    # 일반 풀 : 부스트 풀 = 6:4로 섞는다. 부스트 풀이 더 크면 비율이 뒤집힌다.
    mix:
      normal: 6
      boost: 4
    # 한 번 보여준 상대를 다시 후보에 넣지 않는 시간.
    exposure-cooldown-minutes: 15
    # 한 번 산정한 노출 순서를 유지하는 시간("그 세션 동안").
    session-ttl-minutes: 30
  store:
    # 기획서 Plan_2 화면 25~30의 가격표를 그대로 옮긴 값이다.
    # price 단위는 "루나". 현금 가격(충전팩·프라임)은 스토어 콘솔이 권위이므로 여기 두지 않는다.
    luna-products:
      # 부스트 — 1매당 1시간. 10매 묶음은 20% 할인가(화면 25)
      # Plan_3에서 스포트라이트 부스트는 폐지됐다(포스트 부스트만 남는다).
      POST_BOOST_5:       { type: BOOST,       kind: POST_BOOST,      price: 400, quantity: 5,  reason: BUY_BOOST }
      POST_BOOST_10:      { type: BOOST,       kind: POST_BOOST,      price: 640, quantity: 10, reason: BUY_BOOST }
      # 패스 — 7일/30일 (화면 25·29·30)
      ALBUM_PASS_7D:      { type: ENTITLEMENT, kind: ALBUM_PASS,      price: 250, duration-days: 7,  reason: BUY_ALBUM_PASS }
      ALBUM_PASS_30D:     { type: ENTITLEMENT, kind: ALBUM_PASS,      price: 800, duration-days: 30, reason: BUY_ALBUM_PASS }
      TRANSLATE_PASS_7D:  { type: ENTITLEMENT, kind: TRANSLATE_PASS,  price: 250, duration-days: 7,  reason: BUY_TRANSLATE_PASS }
      TRANSLATE_PASS_30D: { type: ENTITLEMENT, kind: TRANSLATE_PASS,  price: 800, duration-days: 30, reason: BUY_TRANSLATE_PASS }
    # 루나 충전 패키지(인앱결제) — 화면 27. 표시 가격은 스토어 SDK의 현지 가격을 쓴다.
    luna-packs:
      LUNA_200:   { luna: 200,   bonus: 0 }
      LUNA_1000:  { luna: 900,   bonus: 100 }    # 10% 할인 · 9,000원
      LUNA_5000:  { luna: 4250,  bonus: 750 }    # 15% 할인 · 42,500원
      LUNA_10000: { luna: 8000,  bonus: 2000 }   # 20% 할인 · 80,000원
      LUNA_25000: { luna: 17500, bonus: 7500 }   # 30% 할인 · 175,000원
    # 프라임(인앱결제) — 화면 26. 1개월 12,900원 / 6개월 61,900원(20% 할인)
    #
    # 🚨 TRANSLATE_PASS가 여기 들어 있어야 한다(기획 화면 26의 네 번째 혜택 "자동 번역 무제한").
    #    번역은 예전부터 프라임에게 무제한이었지만, 그건 `translate()`가 isPrime을 따로
    #    보고 있어서였다 — **혜택 목록에는 없는 혜택**이라 화면이 그릴 수 없었다.
    #    권리를 실제로 지급해 두면 데이터가 곧 화면이 되고, 특별 취급이 사라진다.
    prime-plans:
      PRIME_1M:
        product: PRIME_1M
        duration-days: 30
        entitlements: [ALBUM_PASS, UNLIMITED_CHAT_REQ, TRANSLATE_PASS]
        boosts: { POST_BOOST: 10 }
      PRIME_6M:
        product: PRIME_6M
        duration-days: 180
        entitlements: [ALBUM_PASS, UNLIMITED_CHAT_REQ, TRANSLATE_PASS]
        # ⚠️ 6개월 부스트를 일괄 지급할지 매월 지급할지 기획 확인 필요 — 일단 6배로 둔다
        boosts: { POST_BOOST: 60 }
  comment:
    # 댓글 규칙(기획 4-2). 달빛 한마디(8-2·8-3)의 댓글도 규칙이 같아 이 값을 함께 쓴다.
    max-length: 50
    # 3단계까지 = 댓글 / 대댓글 / 대대댓글. 그 이상은 서버가 거절한다.
    max-depth: 3
  daily-question:
    # 달빛 한마디 본문 길이(기획 8-3). 댓글은 app.comment.max-length를 따른다.
    max-length: 100
  chat:
    # 대화 신청 — 하루 N회는 공짜, 그 뒤로는 1건당 루나를 뺀다(기획서 5장).
    free-requests-per-day: 10
    request-luna-cost: 5
    # 대화 신청 한마디(기획 4-3 시안의 `0/200`). 친구 신청 25자와 자리가 다르다 —
    # 이쪽은 첫인사를 제대로 쓰는 칸이다.
    request-message-max-length: 200
    # 음성 메시지 최대 길이. 클라도 이 시간에서 자동 정지하므로 두 값을 함께 바꿀 것.
    voice-max-duration-ms: 30000
    # 음성 메시지 무료 횟수 — 기획 5장: "계정별 5회 무료. **초기화 되지 않음.**"
    # 하루가 아니라 평생이다(lifetime_usage, V21). 프라임이면 세지 않는다.
    free-voice-messages: 5
    # 프라임의 대화 신청이 상대 목록 최상단에 머무는 시간(기획 9-1 — "1일간").
    request-priority-hours: 24
    # 거절당한 상대에게 다시 신청할 수 없는 시간(기획 §2-5의 "1일").
    # 시간 단위로 둔 건 "하루"의 경계가 영업일이 아니라 **거절한 순간부터**이기 때문이다.
    rejection-cooldown-hours: 24
    # 메시지 보관 기간. 방 타입 기준으로 판정한다(친구를 끊어 ENDED가 된 방도 FRIEND 기준).
    retention-days: 30
    retention-days-friend: 365
    # 한 번에 지울 행 수. 큰 트랜잭션으로 테이블을 오래 잠그지 않도록 나눠서 지운다.
    retention-batch-size: 1000
  scheduler:
    # ⚠️ 아래 cron 시각은 app.session.rollover-hour와 맞춰야 한다(경계 직후에 돈다).
    daily-cleanup-cron: "0 5 18 * * *"
    presence-sweep-ms: 300000
    # 배치를 수동 실행하는 개발용 엔드포인트(운영에서는 절대 켜지 말 것).
    dev-trigger-enabled: false
  presence:
    # 마지막 접속 시각(users.last_seen_at)을 사람당 몇 초에 한 번만 쓸 것인가.
    # 하트비트마다 쓰면 접속자 수만큼 초당 UPDATE가 생긴다. 친구 목록이 보여 주는 건
    # "N시간 전 접속"이라 이 정도로 뒤처져도 표시가 달라지지 않는다.
    last-seen-throttle-seconds: 300
  friend:
    # Plan_3에서 과금과 무관하게 100명으로 통일됐다(20 vs 30 모순이 이렇게 정리됨).
    # 다시 갈릴 수 있어 키는 둘 다 남겨 둔다.
    max-count: 100
    max-count-premium: 100
    # 친구 신청과 함께 보내는 한마디(기획 5-1). 대화 신청 200자보다 훨씬 짧다 —
    # 대화를 여는 자리가 아니라 인사 한 줄이기 때문이다.
    request-message-max-length: 25
  redis:
    enabled: false
  storage:
    type: local
    local-path: server/uploads
    download-url-ttl-minutes: 10
    region: ap-northeast-2
  auth:
    social:
      line:
        enabled: false
        client-id: ${LINE_CLIENT_ID:}
        client-secret: ${LINE_CLIENT_SECRET:}
        verify-url: https://api.line.me/oauth2/v2.1/verify
      kakao:
        enabled: false
        client-id: ${KAKAO_CLIENT_ID:}
        client-secret: ${KAKAO_CLIENT_SECRET:}
        verify-url: https://kapi.kakao.com/v2/user/me
      google:
        enabled: false
        client-id: ${GOOGLE_CLIENT_ID:}
        client-secret: ${GOOGLE_CLIENT_SECRET:}
        verify-url: https://www.googleapis.com/oauth2/v3/tokeninfo
  translate:
    # 공급자. none이면 원문을 그대로 돌려준다 —
    # 🚨 이 상태에서는 **무료 자리를 쓰지 않는다**(번역도 안 되는데 횟수만 깎을 수 없다).
    #
    # 개발 중 쿼터 흐름을 확인하려면 `mock`으로 바꾼다(번역하지 않고 〔ja〕 표시만 붙인다).
    # ⚠️ 운영에서는 절대 mock을 쓰지 말 것.
    provider: none
    # 🚨 자리마다 **세는 단위가 다르다**(기획 4-2 · 5장 · 8-3).
    #   ▸ 댓글창: "5회 **호출**까지 무료" — 번역 건수가 아니라 창을 여는 횟수.
    #     창 하나를 열면 그 안의 댓글은 몇 개든 번역된다. 영업일마다 다시 채워진다.
    #   ▸ 대화방: "5개까지 무료, **대화방 삭제 전까지** 계속" —
    #     하루가 아니라 **동시에** 열어 둘 수 있는 방의 수. 방이 끝나면 자리가 빈다.
    # (⑦단계 전에는 둘 다 "하루 2회"였다 — 값도 단위도 기획서와 달랐다)
    free-comment-opens: 5
    free-chat-rooms: 5
  profile:
    forbidden-nicknames: 관리자,admin,운영자,달빛톡,moonlighttalk
