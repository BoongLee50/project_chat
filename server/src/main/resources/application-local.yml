spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/moonlighttalk?useUnicode=true&characterEncoding=utf8
    username: moonlighttalk
    password: moonlighttalk
    driver-class-name: org.mariadb.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379

app:
  redis:
    enabled: false
  storage:
    type: local
  auth:
    social:
      # 개발용 목 로그인 — 실제 소셜 키 없이 로그인/온보딩 흐름 테스트.
      # 비활성 provider 자리를 mock이 대신 받는다(MockAuthProvider). 운영에서는 절대 켜지 말 것.
      mock:
        enabled: true

logging:
  level:
    root: INFO
    com.moonlighttalk.server: DEBUG
